name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install cargo-apk
      run: cargo install cargo-apk

    - name: Build Android APK
      run: |
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk "platforms;android-30"
        
        NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 -type d | head -n 1)
        echo "Found NDK at: $NDK_PATH"
        
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_NDK_ROOT=$NDK_PATH
        
        cargo apk build

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rust-android-apk
        path: "target/**/*.apk"








