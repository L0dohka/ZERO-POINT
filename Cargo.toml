[package]
name = "zero_point"
version = "0.1.0"
edition = "2021"
description = "ZERO POINT: Last Stand - a stylized first-person sci-fi arena prototype"

[lib]
name = "bevy_mobile_example"
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = "0.15.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
